<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>クイズでそだてよう ver.2</title>
<style>
:root{--bg:#fff4e0;--card:#fff;--tx:#3b2f2a;--sub:#7a6a60;--ac:#ff7a59;--ok:#34b36b;--ng:#c9c2bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f27;--card:#272d38;--tx:#f1ece6;--sub:#a79d94;--ac:#ff8a6b}}
:root[data-theme="dark"]{--bg:#1b1f27;--card:#272d38;--tx:#f1ece6;--sub:#a79d94;--ac:#ff8a6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;max-width:480px;margin:0 auto;padding:12px}
nav{display:flex;gap:8px;margin-bottom:12px}
button{font:inherit;font-weight:700;border:0;border-radius:18px;background:var(--card);color:var(--tx);padding:12px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.15)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
nav button{flex:1}nav .on{background:var(--ac);color:#fff}
.scene{border-radius:24px;padding:18px;text-align:center;color:#2b2b3a;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.pet{animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){.pet{animation:none}}
.items{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.msg{min-height:1.6em;text-align:center;font-weight:700;margin:10px 0}
.gen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gen button{padding:16px 4px;font-size:15px}.gen b{display:block;font-size:36px}
.big{font-size:96px;line-height:1.1}.w{font-size:28px;font-weight:700}.cnt{font-size:44px;line-height:1.3;word-break:break-all}
.q{text-align:center;background:var(--card);border-radius:24px;padding:18px;margin-bottom:14px}
.ch{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ch button{font-size:48px;padding:18px 0}
.ok{background:var(--ok)!important;color:#fff}.ng{background:var(--ng)!important;opacity:.5}
.sm{font-size:13px;padding:8px 12px;color:var(--sub);box-shadow:none;border:1px solid var(--sub);background:transparent}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.c{background:var(--card);border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;min-height:84px}
.c.lock{opacity:.45;filter:grayscale(1)}
h3{margin:16px 0 8px}
</style></head><body>
<nav><button id="tp" class="on" onclick="tab(0)">あそぶ</button><button id="tz" onclick="tab(1)">ずかん</button></nav>
<main id="v"></main>
<script>
const IMG={}; // ここに画像を登録: 'base1':'data:image/png;base64,...' など
const BASE=[['base1','🐥','ひよこ'],['base2','🐰','うさぎ'],['base3','🦎','ちびきょうりゅう'],['base4','🐛','いもむし'],['base5','🚗','くるま'],['base6','🐟','おさかな']];
const GEN=[['h','ひらがな','あ'],['n','すうじ','1'],['a','ABC','A']];
const EV={base1_h:['🦜','おしゃべりオウム'],base1_n:['🦉','かしこいフクロウ'],base1_a:['🦢','ABCスワン'],base2_h:['🦄','ひらがなユニコーン'],base2_n:['🐼','かぞえパンダ'],base2_a:['🦊','ABCきつね'],base3_h:['🦖','ひらがなティラノ'],base3_n:['🦕','かぞえブラキオ'],base3_a:['🐉','ABCドラゴン'],base4_h:['🦋','ひらがなちょうちょ'],base4_n:['🐞','かぞえてんとうむし'],base4_a:['🐝','ABCみつばち'],base5_h:['🚒','ひらがなしょうぼうしゃ'],base5_n:['🚌','かぞえバス'],base5_a:['🚀','ABCロケット'],base6_h:['🐬','ひらがなイルカ'],base6_n:['🐙','かぞえタコ'],base6_a:['🐳','ABCクジラ']};
const IT={h:[['🎀','リボン'],['📖','えほん'],['👑','かんむり'],['🧸','ぬいぐるみ'],['🏆','トロフィー']],n:[['🍪','クッキー'],['⚽','ボール'],['🎈','ふうせん'],['🎁','プレゼント'],['🎂','ケーキ']],a:[['🎵','おんぷ'],['🎩','ぼうし'],['🌈','にじ'],['🚲','じてんしゃ'],['🌟','おほしさま']]};
const TH=[3,8,15,25,40],NEED=[20,50,100],SZ=[110,150,190,220];
function evi(b,g,l){const[e,n]=EV[b+'_'+g];return l==1?[e,n]:l==2?[e+'✨','スーパー'+n]:[e+'👑','ウルトラ'+n]}
const BG=[['#cfeaff,#fff3c9','おひさま',0],['#cdf2c4,#f4ffd0','もり',10],['#ffd3b8,#ffe9a0','ゆうやけ',25],['#2f3470,#7a52b0','ほしぞら',45],['#0b3d5c,#2aa6b9','うみ',70],['#ffd1e8,#c9b3ff','にじいろ',100]];
const H='あ,あり,🐜;い,いぬ,🐶;う,うし,🐮;え,えび,🦐;お,おにぎり,🍙;か,かに,🦀;き,きりん,🦒;く,くま,🐻;け,けーき,🍰;こ,こあら,🐨;さ,さかな,🐟;し,しか,🦌;す,すいか,🍉;た,たこ,🐙;ち,ちょうちょ,🦋;つ,つき,🌙;と,とり,🐦;な,なす,🍆;に,にんじん,🥕;ね,ねこ,🐱;は,はな,🌸;ひ,ひこうき,✈️;ふ,ふね,🚢;へ,へび,🐍;ほ,ほし,⭐;み,みかん,🍊;め,めがね,👓;も,もも,🍑;や,やま,⛰️;ゆ,ゆき,⛄;ら,らいおん,🦁;り,りんご,🍎;れ,れもん,🍋;わ,わに,🐊'.split(';').map(s=>s.split(','));
const AW='A,アップル,🍎;B,バナナ,🍌;C,キャット,🐱;D,ドッグ,🐶;E,エレファント,🐘;F,フィッシュ,🐟;G,グレープ,🍇;H,ホース,🐴;I,アイスクリーム,🍦;J,ジュース,🧃;K,キー,🔑;L,ライオン,🦁;M,マイク,🎤;N,ナッツ,🥜;O,オレンジ,🍊;P,ピザ,🍕;Q,クイーン,👸;R,ロケット,🚀;S,サン,☀️;T,タイガー,🐯;U,アンブレラ,☂️;V,バイオリン,🎻;W,ウォッチ,⌚;Y,ヨット,⛵;Z,ゼブラ,🦓'.split(';').map(s=>s.split(','));
const K='quizpet-v1',$=s=>document.querySelector(s),R=n=>Math.floor(Math.random()*n),P=a=>a[R(a.length)],SH=a=>a.sort(()=>Math.random()-.5);
let S={base:null,evo:null,pp:{h:0,n:0,a:0},pts:{h:0,n:0,a:0},seen:[]},Q=null,M='';
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(S.evo&&!S.lv)S.lv=1;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const sum=o=>o.h+o.n+o.a;
const ic=(id,e,s)=>IMG[id]?`<img src="${IMG[id]}" alt="" style="width:${s}px;height:${s}px;object-fit:contain">`:`<span style="font-size:${s*.85}px;line-height:1">${e}</span>`;
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function tab(i){Q=null;$('#tp').className=i?'':'on';$('#tz').className=i?'on':'';i?gallery():home()}
function bgi(){let b=0;BG.forEach((x,i)=>{if(sum(S.pts)>=x[2])b=i});return b}
function home(){
 if(!S.base){$('#v').innerHTML='<div class="msg">なかまを えらんでね</div><div class="gen" style="grid-template-columns:repeat(2,1fr)">'+BASE.map(b=>`<button onclick="pick('${b[0]}')">${ic(b[0],b[1],64)}<br>${b[2]}</button>`).join('')+'</div>';return}
 const b=BASE.find(x=>x[0]==S.base),lv=S.lv||0,k=S.base+'_'+S.evo+(lv>1?lv:''),e=lv?evi(S.base,S.evo,lv):null,bg=bgi();
 const its=GEN.flatMap(g=>IT[g[0]].map((t,i)=>S.pts[g[0]]>=TH[i]?ic('item_'+g[0]+i,t[0],40):'')).join('');
 const st=BG[bg][0].split(',');
 const bgs=IMG['bg'+bg]?`url(${IMG['bg'+bg]}) center/cover`:`linear-gradient(160deg,${st[0]},${st[1]})`;
 $('#v').innerHTML=`<div class="scene" style="background:${bgs};${bg==3||bg==4?'color:#fff':''}"><div class="pet">${e?ic(k,e[0],SZ[lv]):ic(b[0],b[1],SZ[0])}</div><b>${e?e[1]:b[2]}</b><div class="items">${its}</div><small>${lv<3?'つぎの しんかまで あと '+Math.max(0,NEED[lv]-sum(S.pp))+' もん':'さいこうしんか！'}</small></div><div class="msg">${M}</div>`+
 (lv>=3?'<button style="width:100%;margin-bottom:10px" onclick="again()">あたらしい なかまを そだてる</button>':'')+('<div class="gen">'+GEN.map(g=>`<button onclick="start('${g[0]}')"><b>${g[2]}</b>${g[1]}</button>`).join('')+'</div>')+
 '<div style="text-align:center;margin-top:14px"><button class="sm" onclick="askAgain()">なかまを えらびなおす</button></div>';
}
function pick(id){S.base=id;S.evo=null;S.lv=0;S.pp={h:0,n:0,a:0};if(!S.seen.includes(id))S.seen.push(id);save();M='よろしくね！';home()}
const AM='ほかの なかまに かえるけど、いいかな？';
function askAgain(){say(AM);$('#v').innerHTML='<div class="q"><div class="w">'+AM+'</div><div><button class="sm" onclick="say(AM)">🔊 もういちど きく</button></div><div class="gen" style="grid-template-columns:repeat(2,1fr);margin-top:16px"><button onclick="home()">やめる</button><button style="background:var(--ac);color:#fff" onclick="again()">かえる</button></div></div>'}
function again(){S.base=null;S.evo=null;save();M='';home()}
const WM='ぜんぶ きえちゃうけど、いいかな？';
function wipe(){say(WM);$('#v').innerHTML='<div class="q"><div class="w">ぜんぶ きえちゃうけど、いいかな？</div><div><button class="sm" onclick="say(WM)">🔊 もういちど きく</button></div><div class="gen" style="grid-template-columns:repeat(2,1fr);margin-top:16px"><button onclick="tab(0)">やめる</button><button style="background:var(--ac);color:#fff" onclick="wipeOk()">けす</button></div></div>'}
function wipeOk(){S={base:null,evo:null,pp:{h:0,n:0,a:0},pts:{h:0,n:0,a:0},seen:[]};save();M='';tab(0)}
function mk(k){
 if(k=='h'){const[c,w,e]=P(H);const o=[c];while(o.length<3){const d=P(H)[0];if(!o.includes(d))o.push(d)}
  return{k,top:`<div class="big">${e}</div>`,ch:SH(o),ans:c,say:`${w}。${w}の さいしょの もじは どれかな？`}}
 if(k=='n'){const c=1+R(10),o=[c];while(o.length<3){const d=1+R(10);if(!o.includes(d))o.push(d)}
  return{k,top:`<div class="cnt">${P(['🍎','⭐','🐟','🍓','🚗']).repeat(c)}</div>`,ch:SH(o),ans:c,say:'いくつ あるかな？'}}
 if(R(2)){const[c,w,e]=P(AW);const o=[c];while(o.length<3){const d=P(AW)[0];if(!o.includes(d))o.push(d)}return{k,top:`<div class="big">${e}</div>`,ch:SH(o),ans:c,say:`${w}。${w}の さいしょの もじは どれかな？`}}
 const L=String.fromCharCode(65+R(26)),o=[L.toLowerCase()];while(o.length<3){const d=String.fromCharCode(97+R(26));if(!o.includes(d))o.push(d)}
 return{k,top:`<div class="big">${L}</div>`,ch:SH(o),ans:L.toLowerCase(),say:`${L}。おおきい ${L} の ちいさい もじは どれかな？`}
}
function start(k){Q=mk(k);M='';quiz()}
function quiz(msg){
 $('#v').innerHTML=`<div class="q">${Q.top}<div><button class="sm" onclick="say(Q.say)">🔊 もういちど きく</button></div></div><div class="msg" id="m">${msg||''}</div><div class="ch">`+Q.ch.map(c=>`<button onclick="ans(this,'${c}')">${c}</button>`).join('')+'</div><div style="text-align:center;margin-top:14px"><button class="sm" onclick="home()">もどる</button></div>';
 if(!msg)say(Q.say);
}
function ans(btn,v){
 if(!Q||Q.done)return;
 if(v!=Q.ans){btn.classList.add('ng');btn.disabled=true;$('#m').textContent='おしい！ もういっかい';say('おしい。もういっかい');return}
 Q.done=1;btn.classList.add('ok');const k=Q.k,t0=sum(S.pts);
 S.pts[k]++;S.pp[k]++;let m='せいかい！ 🎉';
 const i=TH.indexOf(S.pts[k]);if(i>=0)m+=` ${IT[k][i][1]}を ゲット！`;
 if(BG.some(b=>b[2]>t0&&b[2]<=sum(S.pts)))m+=' あたらしい はいけい！';
 let ev=0;
 const L0=S.lv||0;if(L0<3&&sum(S.pp)>=NEED[L0]){if(!L0)S.evo=GEN.map(g=>g[0]).sort((a,b)=>S.pp[b]-S.pp[a])[0];S.lv=L0+1;const id=S.base+'_'+S.evo+(S.lv>1?S.lv:'');if(!S.seen.includes(id))S.seen.push(id);ev=1;m=S.lv==3?'ウルトラしんか！ すごーい！ 🌟':'しんか したよ！ すごい！ 🌟'}
 save();$('#m').textContent=m;say(ev?'しんか したよ。すごいね':'せいかい！');
 setTimeout(()=>{if(ev){M=m;home()}else{Q=mk(k);quiz()}},ev?1800:1300);
}
function gallery(){
 const c=(id,e,n,on)=>`<div class="c ${on?'':'lock'}">${on?ic(id,e,48):'<span style="font-size:40px">？</span>'}<br>${on?n:'？？？'}</div>`;
 let h='';BASE.forEach(b=>{h+=`<h3>${b[2]}</h3><div class="g">`+c(b[0],b[1],b[2],S.seen.includes(b[0]))+'<div></div><div></div>';[1,2,3].forEach(l=>GEN.forEach(g=>{const id=b[0]+'_'+g[0]+(l>1?l:''),x=evi(b[0],g[0],l);h+=c(id,x[0],x[1],S.seen.includes(id))}));h+='</div>'});h+='<h3>アイテム</h3><div class="g">';
 GEN.forEach(g=>IT[g[0]].forEach((t,i)=>h+=c('item_'+g[0]+i,t[0],t[1],S.pts[g[0]]>=TH[i])));
 h+='</div><h3>はいけい</h3><div class="g">'+BG.map((b,i)=>c('bg'+i,'🖼️',b[1],sum(S.pts)>=b[2])).join('')+'</div>';
 h+='<div style="text-align:center;margin:20px 0"><button class="sm" onclick="wipe()">ずかんを ぜんぶ けす</button></div>';$('#v').innerHTML=h;
}
home();
</script></body></html>
