<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>クイズでそだてよう メニュー</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#2a2a33;--sub:#6c6c78;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181d;--card:#24262d;--tx:#eceaf2;--sub:#a3a3b0}}
:root[data-theme="dark"]{--bg:#17181d;--card:#24262d;--tx:#eceaf2;--sub:#a3a3b0}
*{box-sizing:border-box}
body{margin:0 auto;max-width:520px;padding:24px 16px;background:var(--bg);color:var(--tx);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
h1{font-size:22px;margin:0 0 4px}
.lead{margin:0 0 18px;color:var(--sub);font-size:14px}
.card{display:flex;align-items:center;gap:16px;padding:20px;margin:14px 0;border-radius:22px;border-left:10px solid var(--c);background:var(--card);color:inherit;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.card:active{transform:translateY(2px);box-shadow:none}
.card:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.ic{font-size:54px;line-height:1}
.t b{display:block;font-size:20px;margin-bottom:4px}
.t span{font-size:14px;color:var(--sub)}
.note{margin-top:24px;font-size:12px;color:var(--sub);text-align:center}
</style></head><body>
<h1>クイズでそだてよう</h1>
<p class="lead">だれがあそぶか えらんでね</p>
<main id="m"></main>
<p class="note">育成データは、それぞれのページごとに保存されます。</p>
<script>
const MENU=[
 {ic:'🐥',t:'ようちえんのおともだち',s:'ひらがな・すうじ・ABC（4さいむけ）',u:'https://claude.ai/artifact/EXoP9FNJ58WgNfrCg8pbLZ',c:'#ff9f43'},
 {ic:'🧪',t:'中学生向け化学',s:'元素記号・化学式・反応式',u:'https://claude.ai/artifact/Xguo5T5eaBFT8BgHrfsSWF',c:'#3563e9'}
];
document.getElementById('m').innerHTML=MENU.map(x=>`<a class="card" style="--c:${x.c}" href="${x.u}" target="_blank" rel="noopener noreferrer"><span class="ic">${x.ic}</span><span class="t"><b>${x.t}</b><span>${x.s}</span></span></a>`).join('');
</script></body></html>
