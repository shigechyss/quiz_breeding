<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ケミカルペット 中学生向け</title>
<style>
:root{--bg:#eaf1fa;--card:#fff;--tx:#18283d;--sub:#5d6f86;--ac:#3563e9;--ok:#1f9d63;--ng:#c4ccd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1722;--card:#1a2433;--tx:#e8eef6;--sub:#8fa0b5;--ac:#6b93ff}}
:root[data-theme="dark"]{--bg:#0f1722;--card:#1a2433;--tx:#e8eef6;--sub:#8fa0b5;--ac:#6b93ff}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif;max-width:520px;padding:12px}
nav{display:flex;gap:8px;margin-bottom:12px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;background:var(--card);color:var(--tx);padding:12px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.18)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
nav button{flex:1}nav .on,.pri{background:var(--ac);color:#fff}
.scene{border-radius:18px;padding:16px;text-align:center;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#14213a}
.pet{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@media(prefers-reduced-motion:reduce){.pet{animation:none}}
.items{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.msg{min-height:1.6em;text-align:center;font-weight:700;margin:10px 0}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.q{background:var(--card);border-radius:18px;padding:20px 14px;text-align:center;font-size:18px;line-height:1.7}
.q b{font-size:26px}.rx{font-size:24px;margin-bottom:8px;font-weight:700}
.bl{display:inline-block;border:2px dashed var(--ac);border-radius:6px;padding:0 6px;margin-right:2px;color:var(--ac)}
.cc button{font-size:22px;padding:18px 6px}
.ok{background:var(--ok)!important;color:#fff}.ng{background:var(--ng)!important;opacity:.5}
.sm{font-size:13px;padding:8px 12px;color:var(--sub);box-shadow:none;border:1px solid var(--sub);background:transparent}
.c{background:var(--card);border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;min-height:76px}
.c.lock{opacity:.45;filter:grayscale(1)}
h3{margin:16px 0 8px}
</style></head><body>
<nav><button id="tp" class="on" onclick="tab(0)">ホーム</button><button id="tz" onclick="tab(1)">図鑑</button></nav>
<main id="v"></main>
